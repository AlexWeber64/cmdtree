# Builds every supported Minecraft version on every merge request, every
# push to master, and every tag, and keeps the jars as a downloadable
# artifact. Pushing a v* tag (e.g. v1.0.1) also publishes a release.

# Run for merge requests, the default branch, and tags, without a duplicate
# branch pipeline for every push to an open merge request.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:
  # Gradle runs on JDK 21. The foojay resolver (settings.gradle.kts)
  # downloads the other JDKs that individual Minecraft versions compile
  # against, such as 17 for 1.20.x and 25 for 26.x.
  image: eclipse-temurin:21-jdk
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  cache:
    key:
      files: [stonecutter.properties.toml, gradle/wrapper/gradle-wrapper.properties]
    # Dependencies, the wrapper, and the downloaded JDKs. Loom's per-version
    # Minecraft cache is left out because it is several GB across 8 versions.
    paths: [.gradle-home/caches/modules-2/, .gradle-home/wrapper/, .gradle-home/jdks/]
  script:
    - ./gradlew buildAndCollect --no-daemon --stacktrace
    - echo "VERSION=$(sed -n 's/^mod\.version = "\(.*\)"/\1/p' stonecutter.properties.toml)" > version.env
  artifacts:
    name: "cmdtree-$CI_COMMIT_SHORT_SHA"
    paths: [build/libs/*/*.jar]
    reports:
      dotenv: version.env  # hands VERSION to the release job
    expire_in: 30 days

# Publishes a GitLab release for a v* tag. Each version's jar (not the
# sources jars) goes into the project's package registry, which (unlike job
# artifacts) never expires, and the release links to all of them, with the
# commits since the previous tag as its notes.
release:
  stage: deploy
  image: alpine:3.22
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs: [build]
  variables:
    GIT_DEPTH: "0"  # full history, for the release notes
  before_script:
    - apk add --no-cache --quiet curl git jq
  script:
    - |
      if [ -z "$VERSION" ] || [ "$CI_COMMIT_TAG" != "v$VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG doesn't match mod.version '$VERSION' in stonecutter.properties.toml, so nothing was released."
        exit 1
      fi
    - PACKAGE_BASE="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/cmdtree/$VERSION"
    - echo '[]' > links.json
    - |
      for jar in build/libs/"$VERSION"/*.jar; do
        case "$jar" in *-sources.jar) continue ;; esac
        file=$(basename "$jar")
        curl --fail-with-body --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$jar" "$PACKAGE_BASE/$file"
        # Release download paths can't contain "+", which Stonecutter puts
        # between the mod and Minecraft versions; the file keeps its name.
        jq --arg file "$file" --arg url "$PACKAGE_BASE/$file" \
          '. + [{name: $file, url: $url, direct_asset_path: ("/" + ($file | gsub("[+]"; "-"))), link_type: "package"}]' links.json > links.tmp
        mv links.tmp links.json
      done
    - git fetch --quiet --tags origin
    - PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' "$CI_COMMIT_TAG^" 2>/dev/null || true)
    - |
      {
        echo "CmdTree $VERSION. Download the jar for your Minecraft version (the version is in the file name) and put it in your mods folder alongside Fabric API."
        if [ -n "$PREVIOUS" ]; then
          printf '\n## Changes since %s\n\n' "$PREVIOUS"
          git log --no-merges --format='- %s' "$PREVIOUS..$CI_COMMIT_TAG"
        fi
      } > notes.md
    - |
      jq -n --arg tag "$CI_COMMIT_TAG" --arg name "CmdTree $VERSION" --rawfile notes notes.md --slurpfile links links.json \
        '{tag_name: $tag, name: $name, description: $notes, assets: {links: $links[0]}}' \
      | curl --fail-with-body --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --header "Content-Type: application/json" --data @- "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
