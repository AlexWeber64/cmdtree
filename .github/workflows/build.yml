name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all supported Minecraft versions
        run: ./gradlew buildAndCollect --stacktrace

      - name: Upload built jars as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmdtree-jars
          path: build/libs/*/*.jar
